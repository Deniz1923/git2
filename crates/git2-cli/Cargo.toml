[package]
name = "git2-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Experimental Git-compatible CLI with private local recovery history."

# The crate is `git2-cli` (the crates.io name `git2` is taken by libgit2 bindings), but the
# installed binary is invoked as `git2`.
[[bin]]
name = "git2"
path = "src/main.rs"

[dependencies]
git2-core.workspace = true
anyhow.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
